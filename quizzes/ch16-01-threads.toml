[[questions]]
id = "53cb3740-2962-4379-a25f-a65e72812a95"
type = "Tracing"
prompt.program = """
use std::thread;
fn main() {
    let mut n = 1;
    let t = thread::spawn(move || {
        n = n + 1;
        thread::spawn(move || {
            n = n + 1;
        })
    });
    n = n + 1;
    t.join().unwrap().join().unwrap();
    println!("{n}");
}
"""
answer.doesCompile = true
answer.stdout = "2"
context = """
Słowo kluczowe `move` sprawia, że `n` zostaje skopiowane do domknięcia, więc
przypisania `n = n + 1` wewnątrz `thread::spawn` nie mają wpływu na zewnętrzne `n`.
"""

[[questions]]
id = "c2a84e6d-8143-4944-bf20-b00e49144ac9"
type = "MultipleChoice"
prompt.prompt = """
Rozważ ten przykład z tekstu, w którym wątek niepoprawnie przechwytuje wektor:

```
use std::thread;

fn main() {
    let v = vec![1, 2, 3];

    let handle = thread::spawn(|| {
        println!("Here's a vector: {:?}", v);
    });

    handle.join().unwrap();
}
```

Kompilator Rusta wyświetla m.in. taki komunikat diagnostyczny:

```text
note: function requires argument type to outlive `'static`
 --> src/main.rs:6:18
  |
6 |       let handle = thread::spawn(|| {
  |  __________________^
7 | |         println!("Here's a vector: {:?}", v);
8 | |     });
  | |______^
```

Przypomnij sobie, że `'static` to czas życia referencji, które są poprawne przez cały czas działania programu.

Które z poniższych zdań najlepiej opisuje uwagę „function requires argument type to outlive `'static`”?
"""
answer.answer = "Rust nie wie, jak długo wątek będzie działał, więc wartości przechwycone przez wątek muszą żyć wiecznie"
prompt.distractors = [
    "Domknięcie przekazane do `thread::spawn` nie może przyjmować żadnych argumentów",
    "Wektor `v` zawiera wartości, które nie żyją dłużej niż `'static`",
    "Domknięcie może przechwytywać tylko stałe łańcuchowe typu `&'static str`"
]
context = """
Jeśli domknięcie przechwytuje referencję do wartości żyjącej krócej niż `'static`, wątek mógłby żyć dłużej niż ta
wartość i naruszyć bezpieczeństwo pamięci. Zwróć uwagę, że [`thread::scope`](https://doc.rust-lang.org/std/thread/fn.scope.html)
pozwala wątkom przechwytywać niestatyczne referencje dzięki statycznemu ograniczeniu czasu życia wątku.
"""