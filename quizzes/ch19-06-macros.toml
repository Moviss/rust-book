type = "MultipleChoice"
prompt.prompt = """
Które z poniższych powodów są uzasadnione, by zaimplementować makro jako
makro proceduralne zamiast makra deklaratywnego?
"""
answer.answer = [
    "Chcesz zintegrować makro z systemem derive w Ruście",
    "Twoje makro wymaga nietrywialnej analizy składni napisanej przez użytkownika makra",
]
prompt.distractors = [
  "Chcesz generować sekwencje kodu o zmiennej długości",
  "Twoje makro wymaga na wejściu całego elementu, a nie tylko wyrażenia"
]
context = """
Makra proceduralne to jedyny sposób na utworzenie własnego derive. Makra proceduralne
przydają się też, gdy potrzebujesz kodu analizującego składnię użytkownika makra &mdash; makra
deklaratywne pozwalają jedynie przestawiać elementy wejścia, a nie np. obliczać jego rozmiar.

Makra deklaratywne potrafią generować sekwencje kodu o zmiennej długości i mogą opakowywać
lub tworzyć elementy, a nie tylko wyrażenia.
"""

