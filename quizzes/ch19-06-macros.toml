[[questions]]
id = "8c80f9e8-2d95-43cc-9aa4-04d617dd8cb9"
type = "Tracing"
prompt.program = """
macro_rules! manylet {
    ( $( $i:ident ),* = $e:expr ) => {
        $(
            let mut $i = $e;
        )*
    }
}

fn main() {
    let mut s = String::from("A");
    manylet!(x, y = s);
    x.push_str("B");
    println!("{x}{y}");
}
"""
answer.doesCompile = false
answer.lineNumber = 11
context = """
Makro `manylet` składniowo powiela wyrażenie `e` jako wiązanie dla każdej
zmiennej po lewej stronie znaku równości. Ponieważ jednak `s` jest łańcuchem będącym właścicielem swoich danych,
pierwsze wiązanie do `x` przenosi `s`, a drugie wiązanie do `y` jest niepoprawne.
"""

