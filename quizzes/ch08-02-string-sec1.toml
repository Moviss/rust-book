[[questions]]
id = "79942534-f414-41e6-944f-96d57905632c"
type = "MultipleChoice"
prompt.prompt = "Czym różni się użycie `a + b` od `a.push_str(b)` przy łączeniu dwóch łańcuchów?"
answer.answer = "`+` przejmuje własność `a`, a `push_str` nie"
prompt.distractors = [
  "`push_str` jest w czasie działania wydajniejsze niż `+`",
  "`push_str` przejmuje własność `b`, a `+` nie",
  "Nie ma żadnej różnicy, to aliasy tej samej funkcji"
]
context = """
`push_str` przyjmuje `&mut self`, a `+` przyjmuje `self`, więc `+` przejmuje własność, a `push_str` nie.
"""

