prompt.prompt = """
Ile maksymalnie razy może dojść do alokacji na stercie w tym programie? Wpisz odpowiedź cyframi, np. 0 lub 1.

```
let s1 = String::from("tic");
let s2 = String::from("tac");
let s3 = String::from("toe");

let s = s1 + "-" + &s2 + "-" + &s3;
```
"""
answer.answer = "7"
context = """
Jedna alokacja przy każdym wywołaniu `String::from` i jedna przy każdym użyciu `+`.
"""
