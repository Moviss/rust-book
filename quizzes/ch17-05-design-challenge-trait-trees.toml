[multipart]
q = """
**Kontekst:** projektujesz prosty framework interfejsu użytkownika, który składa się z drzewa widżetów, takich jak tekst i przyciski.

**Funkcjonalność:** API udostępnia trait `Widget`, który definiuje, jak działa widżet. Klient API implementuje trait `Widget` i wywołuje go, aby wyrenderować interfejs.

**Rozwiązania:** poniżej znajduje się kilka proponowanych rozwiązań realizujących tę funkcjonalność.

```
// Option 1: children must be Self
pub trait Widget: Sized {
	fn render(&self) -> Vec<Self>;
}

// Option 2: children are a trait parameter
pub trait Widget<Children> {
	fn render(&self) -> Vec<Children>;
}

// Option 3: children are an associated type
pub trait Widget {
	type Children: Widget;
	fn render(&self) -> Vec<Self::Children>;
}

// Option 4: children are a reference trait object
pub trait Widget {
	fn render(&self) -> Vec<&dyn Widget>;
}

// Option 5: children are a boxed trait object
pub trait Widget {
	fn render(&self) -> Vec<Box<dyn Widget>>;
}
```
"""

[[questions]]
type = "MultipleChoice"
multipart = "q"
prompt.prompt = """
Zaznacz każdą opcję projektową, która spełnia następujące wymaganie:

**Wymaganie:** oczekuje się, że klient API dostarczy jeden enum `WidgetImpl` reprezentujący wszystkie możliwe widżety i zaimplementuje trait `Widget` dla `WidgetImpl`.
"""
prompt.distractors = ["2", "3", "4", "5"]
prompt.sortAnswers = true
answer.answer = ["1"]
context = """
Jeśli reprezentujemy wszystkie możliwe widżety jako jeden enum, na przykład tak:

```
enum WidgetImpl {
  Button { /* .. */ },
  Text { /* .. */ },
  // ..
}

impl Widget for WidgetImpl { /* .. */ }
```

to mamy system typu „zamknięty świat”, w którym zbiór możliwych widżetów nie jest rozszerzalny. Istnieje tylko jedna implementacja `Widget` i nie ma potrzeby dynamicznego wywoływania.
Dlatego sens ma tylko opcja 1, ponieważ `render` zwracałby zawsze tylko inne wartości typu `WidgetImpl`. Wszystkie pozostałe rozwiązania przy tym wymaganiu wprowadzają zbędną złożoność.
"""
id = "e529cabf-a14c-4f1b-865f-1f376b704df8"

[[questions]]
type = "MultipleChoice"
multipart = "q"
prompt.prompt = """
Zaznacz każdą opcję projektową, która spełnia następujące wymaganie:

**Wymaganie:** oczekuje się, że klient API dostarczy osobną strukturę dla każdego możliwego widżetu i zaimplementuje trait `Widget` dla każdej z nich.
Każdy widżet może zwrócić wektor zawierający widżety dowolnego typu.
"""
prompt.distractors = ["1", "2", "3"]
prompt.sortAnswers = true
answer.answer = ["4", "5"]
context = """
W odróżnieniu od poprzedniego pytania teraz oczekujemy osobnego typu dla każdego widżetu, na przykład:

```
struct Button { /* .. */ }
impl Widget for Button { /* .. */ }

struct Text { /* .. */ }
impl Widget for Text { /* .. */ }
```

Dlatego wektor widżetów musi być heterogeniczny, tzn. może zawierać widżety różnych typów.
Opcje 1, 2 i 3 ograniczają każdą implementację `Widget::render` do zwracania wektora widżetów jednego typu.
Opcje 4 i 5 używają dynamicznego wywoływania przez obiekty traitów, aby umożliwić heterogeniczne wektory widżetów.
"""
id = "0fdd5ca0-835f-4999-8d24-37841cb0a1a7"


[[questions]]
multipart = "q"
type = "MultipleChoice"
prompt.prompt = """
Zaznacz każdą opcję projektową, która spełnia następujące wymaganie:

**Wymaganie:** z `render` powinny być zwracane tylko typy implementujące trait `Widget`.
"""
prompt.distractors = ["2"]
prompt.sortAnswers = true
answer.answer = ["1", "3", "4", "5"]
context = """
Trait `Widget` w opcji 2 nie wymusza ograniczenia `Children: Widget`.
Wszystkie pozostałe opcje zapewniają zwracanie `Vec<W>` dla pewnego `W` takiego, że `W: Widget`.
"""
id = "fbed1c75-737c-49f5-8f11-66d25391079b"
