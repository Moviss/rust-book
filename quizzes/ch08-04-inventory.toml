id = "867e5d29-c1eb-44b3-99e3-bb2325b74e44"
type = "MultipleChoice"
prompt.prompt = """
**Program 1:**

```ide
/// Removes all the zeros in-place from a vector of integers.
fn remove_zeros(v: &mut Vec<i32>) {
    for (i, t) in v.iter().enumerate().rev() {
        if *t == 0 {
            v.remove(i);
            v.shrink_to_fit();
        }
    }
}
```

Które z poniższych najlepiej opisuje błąd, jaki zgłosiłby kompilator przy próbie skompilowania tej funkcji?
"""
answer.answer = "`v.remove(i)` nie może pożyczyć `v` jako mutowalnego"
prompt.distractors = [
  "`v` nie żyje wystarczająco długo, by wywołać `v.remove(i)`",
  "nie można wykonać dereferencji `t`, dopóki `i` żyje",
  "nie można wywołać `v.iter()` na referencji mutowalnej"
]
context = """
Funkcja `v.iter()` pożycza wektor `v` niemutowalnie na czas trwania pętli for. Jednak `v.remove(i)` wymaga mutowalnej
referencji do `v`. Dlatego `v.remove(i)` nie może pożyczyć `v` jako mutowalnego, bo kolidowałoby to z iteratorem.
"""


