context = """
Każda strategia wymagająca utworzenia nowego wektora, czy to przez `Vec::clone`, czy przez `Vec::new`, wymaga zbędnej dodatkowej alokacji.
Dlatego najprostszą działającą strategią jest iterowanie wyłącznie po indeksach `0 .. v.len()`, co nie pożycza `v`. Robimy to
w odwrotnej kolejności, aby nie usuwać nieistniejących indeksów.

Podobnie jak w problemie 1, najbardziej idiomatyczną strategią jest w rzeczywistości użycie wbudowanej funkcji, której jeszcze nie omawialiśmy:
[`Vec::retain`](https://doc.rust-lang.org/std/vec/struct.Vec.html#method.retain). Ta funkcja zachowuje w wektorze tylko elementy
spełniające predykat, ale robi to oszczędniej pod względem pamięci.
