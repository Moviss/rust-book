type = "MultipleChoice"
prompt.prompt = """
**Program 1:**

```ide
/// Removes all the zeros in-place from a vector of integers.
fn remove_zeros(v: &mut Vec<i32>) {
    for (i, t) in v.iter().enumerate().rev() {
        if *t == 0 {
            v.remove(i);
            v.shrink_to_fit();
        }
    }
}
```

Normalnie przy próbie skompilowania tej funkcji kompilator zwraca następujący błąd:

```text
error[E0502]: cannot borrow `*v` as mutable because it is also borrowed as immutable
 --> test.rs:5:13
  |
3 |     for (i, t) in v.iter().enumerate().rev() {
  |                   --------------------------
  |                   |
  |                   immutable borrow occurs here
  |                   immutable borrow later used here
4 |         if *t == 0 {
5 |             v.remove(i);
  |             ^^^^^^^^^^^ mutable borrow occurs here
```

Załóż, że kompilator NIE odrzucił tej funkcji. Które z poniższych programów (jeśli w ogóle jakieś)
(1) przeszłyby przez kompilator i (2) mogłyby spowodować niezdefiniowane zachowanie po wykonaniu?
Zaznacz każdy program, który spełnia oba kryteria, ALBO zaznacz „Żaden z tych programów”, jeśli żaden ich nie spełnia.
"""
answer.answer = [
"""
```
let mut v = vec![5, 5, 0];
remove_zeros(&mut v);
println!("{:?}", v);
```
""",
"""
```
let mut v = vec![1, 2, 0, 3];
remove_zeros(&mut v);
```
""", 
]
prompt.distractors = [
"""
```
let mut v = vec![1; 100];
remove_zeros(&mut v);
```
""",
"Żaden z tych programów",
]
context = """
Aby naruszyć bezpieczeństwo pamięci, `remove_zeros` musi zostać wywołane z wektorem zawierającym zero po pierwszym elemencie.
Wywołanie `v.shrink_to_fit()` zdealokuje pamięć, której właścicielem jest wektor (z powodu zmiany rozmiaru), co unieważni
iterator `v.iter()` zawierający wskaźnik na stare dane. Zauważ, że odczyt wektora `v` po wywołaniu `remove_zeros`
nie jest niezbędny do naruszenia bezpieczeństwa, ponieważ problem występuje wewnątrz `remove_zeros`.
"""

