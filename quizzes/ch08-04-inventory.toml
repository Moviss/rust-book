type = "MultipleChoice"
prompt.prompt = """
**Program 2:**

```ide
/// Reverses the elements of a vector in-place
fn reverse(v: &mut Vec<String>) {
    let n = v.len();
    for i in 0 .. n / 2 {
        std::mem::swap(&mut v[i], &mut v[n - i - 1]);
    }
}
```

Które z poniższych najlepiej opisuje błąd, jaki zgłosiłby kompilator przy próbie skompilowania tego programu?
"""
answer.answer = "nie można pożyczyć `v` jako mutowalnego dwukrotnie dla `v[i]` i `v[n - i - 1]`"
prompt.distractors = [
  "nie można pożyczyć `v` jako niemutowalnego dla `v.len()`, gdy `v` jest pożyczeniem mutowalnym",
  "nie można mutowalnie pożyczyć elementu `v[i]` mutowalnego wektora"
]
context = """
Kompilator nie bierze pod uwagę konkretnych wartości indeksów używanych do dostępu do tablicy, więc zakłada, że `&mut v[i]`
i `&mut v[n - i - 1]` mogą wskazywać na ten sam element. Dlatego dostajemy błąd mówiący, że
`v` nie może zostać dwukrotnie pożyczony mutowalnie.
"""


