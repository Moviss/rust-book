[[questions]]
multipart = "q"
type = "MultipleChoice"
prompt.prompt = """
Zaznacz każdą opcję projektową, która spełnia następujące wymaganie:

**Wymaganie:** API powinno jak najmniej polegać na mechanizmie wnioskowania typów kompilatora.
"""
prompt.distractors = ["3"]
prompt.sortAnswers = true
answer.answer = ["1", "2"]
context = """
Opcje 1 i 2 nie wymagają wiele wnioskowania typów poza ustaleniem typu funkcji `F`.

Opcja 3 stosuje sztuczkę z przeciążaniem: tworzy trait `Register` sparametryzowany typem „znacznikowym”.
Przypomnij sobie jej dwa wywołania rejestrujące:
```
events.register(|e: OnClick| { /* .. */ })
events.register(|_: Sequential, e: OnClick| { /* .. */ })
```

Wyglądają, jakby używały tej samej implementacji, ale w rzeczywistości odnoszą się do różnych implementacji tej samej metody.
To rozwiązanie polega na tym, że kompilator wywnioskuje typ `Marker`, ustalając, której implementacji `Register`
odpowiada każde wywołanie `.register(..)`. Dlatego jeśli naszym celem jest *nie* polegać na wnioskowaniu typów, opcja 3 jest nieodpowiednia.
"""
id = "e0c4f766-b82a-496a-b669-ea9e0a367af7"