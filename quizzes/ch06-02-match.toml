[[questions]]
id = "f7c361e0-733a-4d48-9809-736e3c1e2b67"
type = "MultipleChoice"
prompt.prompt = """
Rozważ tę metodę zaimplementowaną dla typu `Option`:

```
impl<T> Option<T> {
  fn unwrap_or(self, other: T) -> T {
    match self {
      Some(t) => t,
      None => other
    }
  }
}
```

Które zdanie najlepiej opisuje działanie tej funkcji?
"""
answer.answer = "Zwraca obiekt wewnątrz `self`, jeśli istnieje, a w przeciwnym razie `other`"
prompt.distractors = [
  "Zwraca nową opcję zawierającą obiekt wewnątrz `self`, jeśli istnieje, a w przeciwnym razie `other`",
  "Wstawia `other` do `self`, jeśli `self` nie zawiera jeszcze wartości",
  "Zwraca referencję do obiektu wewnątrz `self`, jeśli istnieje, a w przeciwnym razie `other`"
]
context = """
Ta funkcja „rozpakowuje” opcję: przejmuje ją na własność i wydobywa wartość ze środka, a jeśli wartości nie ma, awaryjnie zwraca `other`.
To prawdziwa funkcja z biblioteki standardowej!
"""


