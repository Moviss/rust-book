[[questions]]
id = "6e012d34-5c59-443e-85d9-385f0d7dee13"
type = "MultipleChoice"
prompt.prompt = """
Rozważ dwie implementacje funkcji, która dwukrotnie zmniejsza o 1 liczbę bez znaku.

```
fn decr_twice_v1(n: u32) -> Option<u32> {
  match n {
    0 => None,
    1 => None,
    n2 => Some(n2 - 2)
  }
}

fn decr_twice_v2(n: u32) -> Option<u32> {
  if n == 0 {
    None
  } else if n == 1 {
    None
  } else {
    Some(n - 2)
  }
}
```

Funkcje zachowują się tak samo dla:
"""
answer.answer = "wszystkich danych wejściowych"
prompt.distractors = [ "żadnych danych wejściowych", "niektórych, ale nie wszystkich danych wejściowych" ]
context = """
`match` i `if` pełnią tu tę samą funkcję. `match` jest jak wyspecjalizowane `if`, które sprawdza równość dopasowywanego obiektu.
"""