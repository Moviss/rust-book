[[questions]]
id = "c5b27431-c318-4243-9621-cadacb737f5a"
type = "MultipleChoice"
prompt.prompt = """
Prawda czy fałsz: ten kod zakończy działanie (czyli nie będzie się wykonywał w nieskończonej pętli).

```
fn main() {
    let mut x = 0;
    'a: loop {
        x += 1;
        'b: loop {
            if x > 10 {
                continue 'a;
            } else {
                break 'b;
            }      
        }
        break;       
    }
}
```
"""
answer.answer = "Prawda"
prompt.distractors = [ "Fałsz" ]
context = """
Faktycznie zakończy działanie po pierwszej iteracji pętli.
"""

[[questions]]
id = "46a52842-d4eb-4dc9-8885-f31a2f2f59b4"
type = "Tracing"
prompt.program = """
fn main() {
    let a = [5; 10];
    let mut sum = 0;
    for x in a {
        sum += x;
    }
    println!("{sum}");
}
"""
answer.doesCompile = true
answer.stdout = "50"
context = """
Tablica `a` zawiera element `5` powtórzony 10 razy, więc jej suma wynosi `50`. Odpowiedź nie brzmi `15` – zwróć uwagę, że składnia `[5; 10]` różni się od `[5, 10]`.
"""
