type = "Tracing"
prompt.program = """
fn main() {
    let mut s = String::from("Hello");
    let mut add_suffix = || s.push_str(" world");
    println!("{s}");
    add_suffix();
}
"""
answer.doesCompile = false
answer.lineNumber = 5
context = """
`add_suffix` pożycza `s` mutowalnie między swoją definicją a użyciem, więc `println` (odczyt `s`) jest niedozwolone.
"""

[[questions]]
id = "266d3cb3-de76-4b91-bd13-c3d6cb9e7fd7"
type = "Tracing"
prompt.program = """
fn main() {
    let mut s = String::from("Hello");
    let add_suffix = |s: &mut String| s.push_str(" world");
    println!("{s}");
    add_suffix(&mut s);
}
"""
answer.doesCompile = true
answer.stdout = "Hello"
context = """
Ponieważ `add_suffix` nie przechwytuje `s`, można odczytać `s` przed zmodyfikowaniem go za pomocą `add_suffix`.
"""

[[questions]]
id = "0f298680-d870-47a1-962c-1c668f75cb68"
type = "MultipleChoice"
prompt.prompt = """
Rozważ następujące API:

```rust
/// Executes a function with a mutable reference to each element of a vector
fn for_each_mut<T, F: ___(&mut T)>(v: &mut Vec<T>, mut f: F) {
    for x in v.iter_mut() {
        f(x);
    }
}
```

Który z poniższych traitów funkcyjnych najlepiej pasuje w puste miejsce?
"""
answer.answer = "`FnMut`"
prompt.distractors = ["`Fn`", "`FnOnce`"]
context = """
`f` jest wywoływane wiele razy, więc `FnOnce` się nie nadaje. Zadziałają zarówno `Fn`, jak i `FnMut`, ale `FnMut` jest mniej restrykcyjny, więc `FnMut` pasuje najlepiej.
"""


[[questions]]
id = "65f574b1-b418-4abe-852e-8b14d88368a7"
type = "MultipleChoice"
prompt.prompt = """
Rozważ następujące API:

```rust
pub struct Analyzer<F> {
    postprocess: F
}

impl<F: ___(i32) -> i32> Analyzer<F> {
    fn process(&self, n: i32) -> i32 { /* .. */ }
    pub fn pipeline(&self, n: i32) -> i32 {
        let n = self.process(n);
        (self.postprocess)(n)
    }
}
```

Który z poniższych traitów funkcyjnych najlepiej pasuje w puste miejsce?
"""
answer.answer = "`Fn`"
prompt.distractors = ["`FnMut`", "`FnOnce`"]
context = """
`pipeline` może zostać wywołane wiele razy, więc `FnOnce` się nie nadaje.
`pipeline` przyjmuje niemutowalną referencję do `self`, więc gdyby `postprocess` było `FnMut`, nie dałoby się go wywołać wewnątrz `pipeline`.
Dlatego najlepiej pasuje tu `Fn`.
"""