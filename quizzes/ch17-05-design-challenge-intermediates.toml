W opcji 1 istnieje tylko jedna instancja `Serialize`, która konwertuje typ `T` na `Value`. Ponieważ opcja 2 jest generyczna względem serializatorów `S`,
za każdym razem, gdy `T::serialize` zostanie wywołane z nowym `S`, kompilator Rusta zmonomorfizuje nową instancję `T::serialize`, co zwiększy rozmiar
pliku binarnego w porównaniu z opcją 1.
"""
id = "2751731e-7d18-46a1-aaea-b5734bf51c80"
