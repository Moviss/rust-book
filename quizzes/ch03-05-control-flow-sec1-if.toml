[[questions]]
id = "5ae11501-25d9-4b94-8e88-aa1c2122779f"
type = "MultipleChoice"
prompt.prompt = """
Prawda czy fałsz: wykonanie tych dwóch fragmentów kodu daje tę samą wartość `x`.

Fragment 1:
```
let x = if cond { 1 } else { 2 };
```

Fragment 2:
```
let x;
if cond {
  x = 1;
} else {
  x = 2;
}
```

(Uwaga: oba fragmenty się kompilują!)
"""
answer.answer = "Prawda"
prompt.distractors = [ "Fałsz" ]
context = """
Pierwsze wyrażenie if to bardziej zwięzły sposób zapisania zachowania drugiej instrukcji if.

Zwróć uwagę, że w drugim fragmencie Rust **nie** wymaga, aby `x` było najpierw zadeklarowane za pomocą `let mut`.
Dzieje się tak, ponieważ Rust potrafi ustalić, że wartość jest przypisywana do `x` tylko raz, skoro zawsze wykona się
tylko jedna gałąź instrukcji if.
"""

[[questions]]
id = "4e07358c-b318-49cb-8210-fbed7ed50e23"
type = "Tracing"
prompt.program = """
fn main() {
  let x = 1;
  let y = if x { 0 } else { 1 }; 
  println!("{y}");
}
"""
answer.doesCompile = false
answer.lineNumber = 3
context = """
Warunek wyrażenia if musi być wartością logiczną. Rust nie ma pojęcia wartości *truthy* ani *falsy*, czyli wartości innych typów traktowanych jak prawda lub fałsz.
"""
