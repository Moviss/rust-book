prompt.prompt = """
Załóżmy, że piszesz program, który musi wykonać pewien kod asynchroniczny, ale co 500 ms sprawdzać, czy obliczenia należy przerwać.
Która funkcja pomocnicza najlepiej nadaje się do realizacji tego zadania?
"""
prompt.distractors = [
  "`join`",
  "`yield`",
  "`spawn` / `spawn_task`"
]
answer.answer = "`race` / `select`"
context = """
Możesz na przykład wykonywać w pętli `select` z długotrwałym future’em i future’em usypiającym, który kończy się po 500 ms.
"""
id = "7da21e95-8e03-412b-8c4d-90ccfc8c6802"
