[[questions]]
id = "1ec0098c-c5dc-46de-a889-b6659c0af757"
type = "MultipleChoice"
prompt.prompt = """
Załóżmy, że piszesz funkcję zgodnie z następującą specyfikacją:

> `round_all` przyjmuje listę liczb zmiennoprzecinkowych i zaokrągla każdą z nich w miejscu do najbliższej liczby całkowitej.

Która z poniższych sygnatur typu najlepiej pasuje do funkcji realizującej tę specyfikację?
"""
answer.answer = """
```
fn round_all(v: &mut Vec<f32>);
```
"""
prompt.distractors = [
"""
```
fn round_all(v: &Vec<f32>) -> Vec<f32>;
```
""",
"""
```
fn round_all(v: Vec<f32>);
```
""",
"""
```
fn round_all(v: &Vec<f32>);
```
"""
]
context = """
Specyfikacja wymaga modyfikowania danych wejściowych w miejscu, dlatego najodpowiedniejsza sygnatura przyjmuje mutowalną referencję do danych wejściowych.
Zarówno niemutowalna referencja, jak i wektor przekazany na własność nie pasują do tej specyfikacji.
"""

[[questions]]
id = "f8ca5ab2-0e5d-4c0d-bca2-99e6763ba9c5"
type = "MultipleChoice"
prompt.prompt = """
Załóżmy, że piszesz funkcję zgodnie z następującą specyfikacją:

> `find_contains` przyjmuje kolekcję łańcuchów znaków i szukany podłańcuch.
> Zwraca listę wszystkich łańcuchów z kolekcji, które zawierają szukany podłańcuch.

Która z poniższych sygnatur typu najlepiej pasuje do funkcji realizującej tę specyfikację?
"""
answer.answer = """
```
fn find_contains(haystack: &[String], needle: &str) -> Vec<&String>;
```
"""
prompt.distractors = [
"""
```
fn find_contains(haystack: &Vec<String>, needle: String) -> Vec<String>;
```
""",
"""
```
fn find_contains(haystack: &[String], needle: &str) -> Vec<String>;
```
""",
"""
```
fn find_contains(haystack: &Vec<String>, needle: &str) -> &[String];
```
"""
]
context = """
W przypadku `haystack` typ wycinka `&[String]` przyjmuje więcej rodzajów danych wejściowych niż `&Vec<String>`, dlatego jest lepszy.
W przypadku `needle` szukany podłańcuch nie musi być zaalokowany na stercie, więc `&str` jest lepszy niż `String`.
Jako typ zwracany `Vec<String>` nie jest pożądany, bo wymagałby sklonowania łańcuchów wejściowych.
`&[String]` nie jest pożądany, bo może zwrócić tylko ciągły fragment danych wejściowych.
`Vec<&String>` jest najlepszy, bo wiąże się tylko z kosztem alokacji wektora, a nie samych łańcuchów.
"""

[[questions]]
id = "868a4edf-16f0-4191-8aed-835c812b8b25"
type = "MultipleChoice"
prompt.prompt = """
Rust normalnie nie pozwala na wiele mutowalnych dostępów do tej samej tablicy, nawet jeśli dotyczą one rozłącznych fragmentów.
Na przykład ta funkcja się nie kompiluje:

```
fn main() {
  let mut v = vec![0, 1, 2, 3];
  let (r0, r1) = (&mut v[0..2], &mut v[2..4]);
  r0[0] += 1;
  r1[0] += 1;  
}
```

Biblioteka standardowa Rusta ma jednak funkcję `slice::split_at_mut`, która na to pozwala:

```
fn main() {
  let mut v = vec![0, 1, 2, 3];
  let (r0, r1) = v.split_at_mut(2);
  r0[0] += 1;
  r1[0] += 1;  
}
```

Które z poniższych zdań najlepiej opisuje, jak można zaimplementować `split_at_mut`?
"""
answer.answer = "`split_at_mut` używa niebezpiecznego kodu, by obejść borrow checker za pomocą surowych wskaźników"
prompt.distractors = [
"`split_at_mut` to specjalna wbudowana operacja kompilatora, której nie da się zaimplementować w samym języku",
"`split_at_mut` używa niebezpiecznego kodu, by wyłączyć sprawdzanie bezpieczeństwa mutowalnych referencji przez borrow checker",
"`split_at_mut` wywołuje bibliotekę napisaną w C, której Rust nie potrafi przeanalizować"
]
context = """
Jak omówiliśmy w [podrozdziale 4.3, „Naprawianie bezpiecznego programu: modyfikowanie różnych elementów tablicy”](ch04-03-fixing-ownership-errors.html#fixing-a-safe-program-mutating-different-array-elements), funkcje takie jak `split_at_mut` są zaimplementowane z użyciem mechanizmu `unsafe`.
Ten mechanizm nie wyłącza całkowicie borrow checkera, lecz pozwala korzystać z określonych niebezpiecznych funkcji, takich jak surowe wskaźniki.
"""


