id = "ba32e57a-e5f2-42e4-8cfd-eb265990c690"
type = "MultipleChoice"
prompt.prompt = """
Przyjrzyj się uprawnieniom w następującym programie:

```aquascope,permissions,boundaries,stepper
#fn main() {
let s = String::new();
let s_ref = &s;`(focus,paths:*s_ref)`
#println!("{s_ref}");
#}
```

Które z poniższych zdań najlepiej wyjaśnia, dlaczego `*s_ref` nie ma uprawnienia @Perm{own} (własność)?
"""
answer.answer = "Własność pozwala na przeniesienie, a przeniesienie danych z referencji może spowodować podwójne zwolnienie"
prompt.distractors = [
  "Własność pozwala na pożyczanie, a ponowne pożyczenie `*s_ref` może spowodować podwójne zwolnienie",
  "Własność pozwala na modyfikowanie, a modyfikacja `*s_ref` może spowodować użycie po zwolnieniu",
  "Własność pozwala na odczyt, a odczyt `*s_ref` może spowodować użycie po zwolnieniu"
]
context = """
Uprawnienie @Perm{own} oznacza własność obiektu. Obiekt może mieć tylko jednego właściciela, dlatego ważne jest,
by referencje nie mogły przekazywać własności typów, których nie da się kopiować, takich jak `String`. Gdyby dwie zmienne
uważały, że są właścicielami tego samego łańcucha, obie próbowałyby go zdealokować, co spowodowałoby podwójne zwolnienie.
"""

