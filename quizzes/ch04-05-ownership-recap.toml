type = "MultipleChoice"
prompt.prompt = """
Borrow checker odrzuca funkcję `transfer_string`:

```rust
fn get_first(strs: &mut (String, String)) -> &mut String {
    &mut strs.0
}

fn get_second(strs: &mut (String, String)) -> &mut String {
    &mut strs.1
}

fn transfer_string(strs: &mut (String, String)) {
    let fst = get_first(strs);
    let snd = get_second(strs);
    fst.push_str(snd);
    snd.clear();
}
```

Wyobraź sobie, że borrow checker nie odrzuca tej funkcji.
Ustal, czy istnieją dane wejściowe, dla których wykonanie tej funkcji spowodowałoby niezdefiniowane zachowanie.
"""
answer.answer = "Ta funkcja NIE mogłaby spowodować niezdefiniowanego zachowania"
prompt.distractors = ["Ta funkcja MOGŁABY spowodować niezdefiniowane zachowanie"]
context = """
Borrow checker odrzuca tę funkcję, ponieważ zakłada, że `get_first` i `get_second` mogą zwrócić mutowalną
referencję do dowolnego elementu krotki, więc `fst` i `snd` mogłyby wskazywać na tę samą wartość. W tym programie
są one jednak zawsze różne, więc funkcja jest w rzeczywistości bezpieczna.
"""



