type = "Tracing"
prompt.program = """
pub mod point {
  #[derive(Debug)]
  pub struct Point(i32, i32);

  impl Point {
    pub fn origin() -> Self { Point(0, 0) }
  }
}

fn main() {
  let mut p = point::Point::origin();
  p.0 += 1;
  println!("{p:?}");
}
"""
answer.doesCompile = false
answer.lineNumber = 12
context = """
Choć zarówno struktura `Point`, jak i metoda statyczna `origin` są publiczne, pole `i32` nie jest oznaczone jako pub. Dlatego bezpośredni dostęp do `p.0` poza
modułem `point` jest niedozwolony. Program skompilowałby się, gdyby zmienić wiersz 3 na `pub struct Point(pub i32, pub i32)`.
"""