[[questions]]
id = "8ef2f170-71d9-4f17-a688-b99d8c8072a8"
type = "Tracing"
prompt.program = """
pub mod a {
  pub mod b {
    pub fn f() { println!("b1"); }
    pub mod c {
      pub fn f() { println!("c1"); }
    }
  }
  pub fn entry() { super::b::c::f(); }
}

pub mod b {
  pub fn f() { println!("b2"); }
  pub mod c {
    pub fn f() { println!("c2"); }
  }
}

fn main() {
  crate::a::entry();
}
"""
answer.doesCompile = true
answer.stdout = "c2"
context = """
`entry` używa ścieżki `super::b::c::f`. `entry` znajduje się w module `a`, więc `super` odnosi się do rodzica modułu `a`, czyli do korzenia crate’a. 
Dzieckiem korzenia o nazwie `b` jest najbardziej zewnętrzny moduł `b`, którego dziecko `c` zawiera funkcję `f` wypisującą `"c2"`.
"""

