[[questions]]
id = "2e273ac2-6f06-4c19-a831-1d44eed89323"
type = "MultipleChoice"
prompt.prompt = """
Rozważ uprawnienia w poniższym programie:

```aquascope,permissions,stepper
#fn main() {
let mut s = String::from("Hello");
let t = &mut s;
/* here */
t.push_str(" world");
println!("{}", s);
#}
```

Jakie uprawnienia ma ścieżka `s` w miejscu oznaczonym `/* here */`? Zaznacz każde z poniższych uprawnień albo zaznacz „Brak uprawnień”,
jeśli ścieżka nie ma żadnych uprawnień.
"""
answer.answer = ["Brak uprawnień"]
prompt.distractors = ["R", "W", "O"]
prompt.answerIndex = 3
context = """
Mutowalne pożyczenie `t = &mut s` odbiera `s` wszystkie uprawnienia, dopóki `t` jest żywe.
"""

[[questions]]
id = "b431f43e-9a6f-4715-ae88-8896fca6ff3b"
type = "MultipleChoice"
prompt.prompt = """
Rozważ uprawnienia w poniższym programie:

```aquascope,permissions,stepper,boundaries
fn get_first(v: &Vec<String>) -> &String {
    &v[0]
}

fn main() {
    let mut strs = vec![
        String::from("A"), String::from("B")
    ];
    let first = get_first(&strs);
    if first.len() > 0 {
        strs.push(String::from("C"));
    }
}
```

Które z poniższych zdań najlepiej wyjaśnia, dlaczego `strs` traci, a potem odzyskuje uprawnienie zapisu?
"""
answer.answer = "`get_first` zwraca niemutowalną referencję do danych wewnątrz `strs`, więc `strs` nie jest zapisywalne, dopóki `first` jest żywe"
prompt.distractors = [
  "`strs` nie jest zapisywalne, dopóki żywa jest niemutowalna referencja `&strs` przekazana do `get_first`",
  "`strs` nie potrzebuje uprawnienia zapisu aż do operacji `strs.push(..)`, więc odzyskuje je dopiero w tej instrukcji",
  "Ponieważ `first` odnosi się do `strs`, `strs` można modyfikować tylko w zagnieżdżonym zasięgu, takim jak instrukcja if"
]
context = """
Gdy wywoływana jest funkcja `get_first`, Rust rozpoznaje, że zwrócony łańcuch `first` może wskazywać na dane wewnątrz `strs`, więc `strs` traci
uprawnienie zapisu. Gdy zmienna `first` przestaje być używana (po warunku instrukcji if), `strs` odzyskuje uprawnienie zapisu.
"""

[[questions]]
id = "652e596c-7cc9-42e6-a7f8-701879cd9a2b"
type = "MultipleChoice"
prompt.prompt = """
Rozważ ten niebezpieczny program:
```aquascope,interpreter,shouldFail
#fn main() {
let v1 = vec![1, 2, 3];
let mut v2 = v1;
v2.push(4);
println!("{}", v1[0]);`[]`    
#}
```

Które z poniższych zdań najlepiej opisuje moment, w którym w tym programie występuje niezdefiniowane zachowanie?
"""
answer.answer = "`v1[0]` odczytuje `v1`, które wskazuje na zdealokowaną pamięć"
prompt.distractors = [
  "`v2` jest właścicielem danych wektora na stercie, a `v1` nie",
  "`v1` zostało przeniesione do `v2` w linii 2",
  "Wskaźnik w `v1` zostaje unieważniony przez `push` w linii 3"
]
context = """
Niezdefiniowane zachowanie wynika z tego, że `v1` jest odczytywane po zwolnieniu. Zauważ, że pozostałe trzy odpowiedzi są prawdziwymi stwierdzeniami
o tym programie, ale nie wyjaśniają, dlaczego niezdefiniowane zachowanie faktycznie występuje. Gdyby na przykład usunąć `println`,
pozostałe trzy odpowiedzi nadal byłyby prawdziwe, ale program nie miałby już niezdefiniowanego zachowania.
"""