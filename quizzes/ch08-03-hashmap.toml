[[questions]]
id = "6028c7f5-b373-475f-ba43-553773c7b3b7"
type = "Tracing"
prompt.program = """
use std::collections::HashMap;
fn main() {
  let mut h: HashMap<char, Vec<usize>> = HashMap::new();
  for (i, c) in "hello!".chars().enumerate() {
    h.entry(c).or_insert(Vec::new()).push(i);
  }
  let mut sum = 0;
  for i in h.get(&'l').unwrap() {
    sum += *i;
  }
  println!("{}", sum);
}
"""
answer.doesCompile = true
answer.stdout = "5"
context = """
Ten program zapisuje w mapie haszującej wektor indeksów wszystkich wystąpień danej litery.
Następnie sumuje wszystkie indeksy litery ‚l’, która występuje w łańcuchu `"hello!"` na indeksach 2 i 3.
"""
