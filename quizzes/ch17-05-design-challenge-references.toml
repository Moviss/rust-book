[multipart]
q = """
**Kontekst:** projektujesz prosty menedżer zasobów dla silnika gier.

**Funkcjonalność:** klient API podaje ścieżki zasobów do załadowania i w zamian otrzymuje dostęp do załadowanych zasobów.

**Założenia:** możesz założyć, że ładowanie odbywa się synchronicznie i natychmiastowo.

**Rozwiązania:** poniżej znajduje się kilka proponowanych rozwiązań realizujących tę funkcjonalność.

```
pub struct AssetManager {
    // ...
}

// Option 1: return a reference
impl AssetManager {
    pub fn load(&mut self, path: PathBuf) -> &Asset;
}

// Option 2: return a mutable reference
impl AssetManager {
    pub fn load(&mut self, path: PathBuf) -> &mut Asset;
}

// Option 3: return a reference-counted pointer
impl AssetManager {
    pub fn load(&mut self, path: PathBuf) -> Rc<Asset>;
}

// Option 4: return a copyable handle that can be turned into a reference
#[derive(Copy, Clone)]
pub struct AssetHandle(usize);

impl AssetManager {
    pub fn load(&mut self, path: PathBuf) -> AssetHandle;
    pub fn get(&self, handle: AssetHandle) -> &Asset;
}
```
"""

[[questions]]
type = "MultipleChoice"
multipart = "q"
prompt.prompt = """
Zaznacz każdą opcję projektową, która spełnia następujące wymaganie:

**Wymaganie:** raz załadowany zasób powinien być na stałe niemutowalny.
"""
prompt.distractors = ["2"]
prompt.sortAnswers = true
answer.answer = ["1", "3", "4"]
context = """
Niemutowalność zasobów wymuszają typy, które nie pozwalają na operacje modyfikujące. Ani niemutowalne pożyczenie `&Asset`,
ani niemutowalny inteligentny wskaźnik taki jak `Rc` nie pozwalają na operacje modyfikujące. Dlatego opcje 1, 3 i 4 SPEŁNIAJĄ to wymaganie.
Opcja 2 zwraca mutowalne pożyczenie, więc NIE spełnia wymagania.
"""
id = "10ae140e-72a6-4594-802a-d656f33cd836"


[[questions]]
type = "MultipleChoice"
multipart = "q"
prompt.prompt = """
Zaznacz każdą opcję projektową, która spełnia następujące wymaganie:

**Wymaganie:** klienci menedżera zasobów muszą zachować dostęp do zasobów przez wiele krótkotrwałych pożyczeń menedżera zasobów.
"""
prompt.distractors = ["1", "2"]
prompt.sortAnswers = true
answer.answer = ["3", "4"]
context = """
„Zachowanie dostępu przez wiele pożyczeń” oznacza, że klient chce napisać program podobny do tego:

```
let asset = {
    let manager = get_manager();
    manager.load("some/path")
};
process_asset(asset);
let another_asset = {
    let manager = get_manager();
    manager.load("another/path")
};
```

W takim przypadku czas życia wartości zwracanej przez `load` nie może być powiązany z czasem życia `AssetManager`. Opcje 1 i 2
wymagają, by `&Asset` i `&mut Asset` żyły tylko tak długo jak `&mut self`. Dlatego borrow checker
odrzuciłby programy takie jak powyższy, w których zasób żyje dłużej niż referencja do menedżera. Opcje 1 i 2 NIE spełniają wymagania.

Opcje 3 i 4 SPEŁNIAJĄ wymaganie. Czas życia `Rc<Asset>` nie jest powiązany z czasem życia `&mut self`. Podobnie czas życia
`AssetHandle` nie jest powiązany z czasem życia `&mut self`.
"""
id = "b69cde98-8ccd-4a89-aeeb-80a3338f9e68"


[[questions]]
multipart = "q"
type = "MultipleChoice"
prompt.prompt = """
Zaznacz każdą opcję projektową, która spełnia następujące wymaganie:

**Wymaganie:** ważne jest, aby wszystkie zasoby zostały zdealokowane w jednym, przewidywalnym momencie.
"""
prompt.distractors = ["3"]
prompt.sortAnswers = true
answer.answer = ["1", "2", "4"]
context = """
Aby zdealokować wszystkie zasoby naraz, `AssetManager` musi zachować wyłączną własność nad nimi.
Dzięki temu, gdy `AssetManager` zostanie zwolniony (lub w inny sposób poinstruowany, by zdealokować zasoby),
mamy gwarancję, że wszystkie zasoby można bezpiecznie zwolnić.
Opcje 1, 2 i 4 SPEŁNIAJĄ to wymaganie. Opcja 4 wymagałaby, aby `AssetManager::get` panikował, jeśli
klient wywoła `manager.get(handle)` po zdealokowaniu zasobu. Jeśli istnieje realna szansa, że klient tak zrobi,
inną możliwością byłoby zwracanie przez `get` wartości `Option<&Asset>`.

Opcja 3 NIE spełnia tego wymagania. Wskaźniki ze zliczaniem referencji są współwłasnością każdego właściciela `Rc<Asset>`.
`AssetManager` nie ma dobrego sposobu, by zapewnić, że w chwili dealokacji żaden zasób nie ma innych właścicieli.
"""
id = "48527488-ecfc-4f16-9824-76a3ac7183f4"
