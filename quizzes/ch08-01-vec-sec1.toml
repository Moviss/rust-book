[[questions]]
id = "1665d1ef-961f-4451-a988-ec46121531f9"
type = "MultipleChoice"
prompt.prompt = """
Które wywołanie funkcji `find_until` spowoduje panikę w czasie działania programu?

```
fn find_until(v: &Vec<i32>, n: i32, til: usize) -> Option<usize> {
  for i in 0 .. til {
    if v[i] == n {
      return Some(i);
    }
  }
  return None;
}
```
"""
answer.answer = "`find_until(&vec![1, 2, 3], 4, 4)`"
prompt.distractors = [
  "`find_until(&vec![1, 2, 3], 0, 0)`",
  "`find_until(&vec![1, 2, 3], 3, 3)`",
  "`find_until(&vec![1, 2, 3], 1, 4)`"
]
context = """
Jeśli `til = 4`, to dla wektora o długości 3 pętla for spróbuje zaindeksować wektor wartością `i = 3`, która wykracza poza jego granice.
Ta funkcja nie panikuje dla `n = 1`, ponieważ kończy działanie, zanim dotrze do indeksu spoza granic.
"""

[[questions]]
id = "789dfffc-7556-443d-98ab-5d0a4db5c162"
type = "Tracing"
prompt.program = """
fn main() {
  let mut v = Vec::new();
  let s = String::from("Hello ");
  v.push(s);
  v[0].push_str("world");
  println!("original: {}", s);
  println!("new: {}", v[0]);
}
"""
answer.doesCompile = false
answer.lineNumber = 6
context = """
`Vec::push` przenosi swój argument, więc po wywołaniu `v.push(s)` nie można już używać `s`. Dlatego wywołanie `println!("original: {}", s)` nie jest bezpieczne z punktu widzenia własności.
"""

[[questions]]
id = "66270f68-3ad6-4e79-8c73-c04d2daf9792"
type = "Tracing"
prompt.program = """
fn main() {
  let v = vec![String::from("Hello ")];
  let mut s = v[0];
  s.push_str("world");
  println!("{s}");
}
"""
answer.doesCompile = false
answer.lineNumber = 3
context = """
Wartości typów, których nie można kopiować, nie da się przenieść z wektora przez indeksowanie. Przeniesienie wartości z wektora umożliwiają tylko metody takie jak `Vec::remove`. Dokładniejsze wyjaśnienie, dlaczego tak jest, znajdziesz w podrozdziale 4.3
[„Naprawianie niebezpiecznego programu: kopiowanie a przenoszenie z kolekcji”](ch04-03-fixing-ownership-errors.html#fixing-an-unsafe-program-copying-vs-moving-out-of-a-collection).
"""