id = "d03748df-8dcf-4ec8-bd30-341927544665"
type = "MultipleChoice"
prompt.prompt = """
Rozważ następującą sygnaturę funkcji bez adnotacji.

```
struct Foo<'a> {
  bar: &'a i32
}

// Foo changed to &Foo
fn baz(f: &Foo) -> &i32 { /* ... */ }
```

Czy Rust zaakceptuje tę sygnaturę funkcji? Jeśli tak, jakie czasy życia wywnioskuje?
"""
answer.answer = "Rust odrzuci tę sygnaturę funkcji"
prompt.distractors = [  
  """
```
fn baz(f: &Foo) -> &i32
```
  """,
  """
```
fn baz<'a>(f: &Foo<'a>) -> &'a i32
```
  """,
  """
```
fn baz<'a>(f: &'a Foo) -> &'a i32
```
  """,
  """
```
fn baz<'a, 'b>(f: &'a Foo<'b>) -> &'a i32
```
  """,
  """
```
fn baz<'a, 'b>(f: &'a Foo<'b>) -> &'b i32
```
  """
]
prompt.answerIndex = 0
context = """
Rust nie skompiluje tego programu, ponieważ nie jest jednoznaczne, czy czas życia wyniku jest powiązany
z czasem życia `&Foo`, czy referencji `Foo.bar`.
"""
