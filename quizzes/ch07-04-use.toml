[[questions]]
id = "a162c2c8-aadf-4963-a997-02a1035f2459"
type = "MultipleChoice"
prompt.prompt = "Które z poniższych stwierdzeń najlepiej opisuje działanie słowa kluczowego `use`?"
answer.answer = "`use` skraca odwołania do elementów ze wskazanej ścieżki"
prompt.distractors = [
  "`use` kopiuje zawartość elementu z jednego modułu do drugiego",
  "`use` daje dostęp do elementów z pominięciem zwykłych reguł prywatności",
  "`use` informuje kompilator, że element będzie używany i należy go zoptymalizować"
]
context = """
`use` pozwala odwoływać się do elementów ze wskazanej ścieżki krócej niż bez `use`, dzięki czemu odwołania są mniej rozwlekłe.
"""


[[questions]]
id = "eccc2099-9880-4628-8474-f1d55e2a4a4a"
type = "ShortAnswer"
prompt.prompt = """
Rozważ poniższy moduł i instrukcję `use`:

```
pub mod parent {
  pub fn a() {}
  fn b() {}
  pub mod child {
    pub fn c() {}
  }
}

fn main() {
  use parent::{*, child as alias};
  // ...
}
```

Ile łącznie ścieżek wewnątrz `main` może odwoływać się do `a`, `b` lub `c` (nie licząc tych, które używają `self`, `super` lub `crate`)?
Wpisz odpowiedź jako cyfrę, np. 0 lub 1. Na przykład gdyby jedynymi poprawnymi ścieżkami były `a` i `parent::b`, odpowiedzią byłoby 2.
"""
answer.answer = "5"
context = """
Do `a` prowadzą dwie ścieżki: `parent::a` i `a`. Do `b` nie prowadzi żadna ścieżka, ponieważ jest prywatna. Do `c` prowadzą trzy ścieżki:
`parent::child::c`, `child::c`, `alias::c`.
"""