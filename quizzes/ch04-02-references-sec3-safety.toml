[[questions]]
id = "5080616f-6f4c-43f7-aa3a-8b23f2798937"
type = "Tracing"
prompt.program = """
fn incr(n: &mut i32) {
  *n += 1;
}

fn main() {
  let mut n = 1;
  incr(&n);
  println!("{n}");
}
"""
answer.doesCompile = false
answer.lineNumber = 7
context = """
Choć `n` jest oznaczone jako `mut`, referencja do `n` również musi być oznaczona jako `mut`.
Poprawna wersja tego programu zawierałaby więc `incr(&mut n)`.
"""


