type = "MultipleChoice"
prompt.prompt = """
W Ruście blok w nawiasach klamrowych, taki jak `{ /* ... */ }`, jest:
1. wyrażeniem
2. instrukcją
3. zasięgiem składniowym
"""
answer.answer = "1 i 3"
prompt.distractors = [ "tylko 1", "tylko 2", "2 i 3" ]
context = """
Blok jest wyrażeniem (nr 1), które może zawierać instrukcje. Wyznacza też zasięg składniowy dla wiązań utworzonych przez let w swoim wnętrzu (nr 3).
"""

[[questions]]
id = "42671602-ada3-4943-aa73-28aebcfe5011"
type = "Tracing"
prompt.program = """
fn f(x: i32) -> i32 { x + 1 }
fn main() {
  println!("{}", f({
    let y = 1;
    y + 1
  }));
}
"""
answer.doesCompile = true
answer.stdout = "3"
