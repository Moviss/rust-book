[[questions]]
id = "05a7959b-4fe7-4ee6-9c25-bfa9a4e72535"
type = "MultipleChoice"
prompt.prompt = """
Które z poniższych to „supermoce”, które Rust udostępnia wewnątrz bloku `unsafe`?
"""
answer.answer = [
    "Dereferencja surowego wskaźnika",
    "Wywołanie funkcji oznaczonej jako `unsafe`",
]
prompt.distractors = [
    "Wyłączenie borrow checkera",
    "Konwersja referencji na surowy wskaźnik",
]
context = """
Bloki `unsafe` pozwalają wykonywać dereferencję surowych wskaźników i wywoływać funkcje `unsafe`. Jednak
`unsafe` nie wyłącza borrow checkera (operacje na bezpiecznych referencjach nadal są sprawdzane).
Referencję można przekonwertować na surowy wskaźnik w zwykłym bezpiecznym kodzie.
"""


[[questions]]
id = "7d50567d-d73c-47d4-922f-480e8d1b7919"
type = "Tracing"
prompt.program = """
fn main() {
    let mut v = Vec::with_capacity(4);
    for i in 0 .. 3 { 
        v.push(i); 
    }
    let n = &raw const v[0];
    v.push(4);
    println!("{}", unsafe { *n });
}
"""
answer.doesCompile = true
answer.stdout = "0"
context = """
Ten program jest niebezpieczny! Kompiluje się poprawnie i wykonuje bez problemów,
ponieważ `Vec` ma wystarczającą pojemność, by `v.push(4)` nie zmieniało jego rozmiaru. Gdyby jednak
pojemność wynosiła 3, `n` wskazywałoby na zdealokowaną pamięć.
"""

[[questions]]
id = "015941ed-d375-4070-a8dc-2f368584b302"
type = "MultipleChoice"
prompt.prompt = """
W których z poniższych sytuacji użycie kodu `unsafe` (lub bezpiecznego opakowania wokół kodu `unsafe`) 
jest idiomatycznym sposobem obejścia borrow checkera?
"""
answer.answer = [    
    "Uzyskanie dwóch mutowalnych referencji do rozłącznych indeksów tablicy",
    "Dopuszczenie, by wartości były niezainicjalizowane, gdy nie są odczytywane",
    "Przechowywanie referencji do jednego pola struktury w innym polu tej samej struktury"
]
prompt.distractors = [
    "Zwrócenie z funkcji wskaźnika na zmienną zaalokowaną na stosie",    
]
context = """
Dwie mutowalne referencje do rozłącznych indeksów są uzasadnione, ponieważ borrow checker nie rozumie, kiedy indeksy są rozłączne. Zob. [`slice::split_at_mut`](https://doc.rust-lang.org/stable/std/primitive.slice.html#method.split_at_mut).

Dopuszczenie niezainicjalizowanych wartości jest uzasadnione, ponieważ borrow checker przyjmuje zachowawczą zasadę, że wartości muszą być zawsze zainicjalizowane, a czasem przydaje się praca z wartościami niezainicjalizowanymi. Zob. [`MaybeUninit`](https://doc.rust-lang.org/stable/std/mem/union.MaybeUninit.html) oraz crate [`take_mut`](https://docs.rs/take_mut/0.2.2/take_mut/index.html).

Przechowywanie przez strukturę referencji do samej siebie jest uzasadnione, ponieważ borrow checker nie potrafi
wnioskować o czasie życia referencji wskazujących na tę samą strukturę. Zob. moduł [`std::pin`](https://doc.rust-lang.org/stable/std/pin/index.html).

Natomiast zwrócenie wskaźnika na zmienną zaalokowaną na stosie *nigdy* nie jest poprawne, nawet w kodzie
niebezpiecznym. Jedynym właściwym obejściem jest odśmiecanie pamięci, np. zwrócenie `Rc<T>`
zamiast `&T`.
"""