id = "95979d75-5823-4059-a1cf-7e0eba69b41a"
type = "MultipleChoice"
prompt.prompt = """
**Program 2:**

```ide
struct TestResult {
    /// Student's scores on a test
    scores: Vec<usize>,

    /// A possible value to curve all scores
    curve: Option<usize>
}
impl TestResult {  
    pub fn get_curve(&self) -> &Option<usize> { 
        &self.curve 
    }

    /// If there is a curve, then increments all 
    /// scores by the curve
    pub fn apply_curve(&mut self) {
        if let Some(curve) = self.get_curve() {
            for score in self.scores.iter_mut() {
                *score += *curve;
            }
        }
    }
}
```

Które z poniższych najlepiej opisuje błąd, jaki zgłosiłby kompilator przy próbie skompilowania tego programu?
"""
answer.answer = "w `apply_curve` nie można pożyczyć `self.scores` jako mutowalnego dla `iter_mut`"
prompt.distractors = [
  "w `get_curve` nie można zwrócić referencji do zmiennej lokalnej `self.curve`",
  "w `apply_curve` nie można pożyczyć `self` jako niemutowalnego dla `get_curve`",
  "w `apply_curve` nie można modyfikować `*score`"
]
context = """
Ze względu na pomijanie czasów życia funkcja `get_curve` ma sygnaturę typu `get_curve<'a>(&'a self) -> &'a Option<usize>`.
Oznacza to, że wywołanie `self.get_curve()` przedłuża pożyczenie całego `self`, a nie tylko `self.curve`.
Dlatego `self` jest niemutowalnie pożyczone w zasięgu `let Some(curve) = ...` i nie można wywołać
`self.scores.iter_mut()`.
"""


