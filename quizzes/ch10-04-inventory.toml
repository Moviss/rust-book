id = "9ff33b87-38e2-471b-8ca4-9c31a6431376"
type = "MultipleChoice"
prompt.prompt = """
**Program 1:**

```ide
/// Returns the n-th largest element in a slice
fn find_nth<T: Ord + Clone>(elems: &[T], n: usize) -> T {
    elems.sort();
    let t = &elems[n];
    return t.clone();
}
```

Które z poniższych najlepiej opisuje błąd, jaki zgłosiłby kompilator przy próbie skompilowania tego programu?
"""
answer.answer = "nie można pożyczyć `elems` jako mutowalnego dla `sort`"
prompt.distractors = [
  "nie można przenieść wartości spod referencji współdzielonej dla `clone`",
  "nie można przenieść wartości spod referencji współdzielonej w wyrażeniu `&elems[n]`",
  "czas życia `T` musi być dłuższy niż czas życia `&[T]`",
]
context = """
Metoda `slice::sort` oczekuje mutowalnej referencji do wycinka, ale
zamiast niej dostaje referencję niemutowalną.
"""


[[questions]]
id = "3ee8d846-d282-4de1-8e83-5ca0bc44fc13"
type = "MultipleChoice"
prompt.prompt = """
**Program 1:**

```ide
/// Returns the n-th largest element in a slice
fn find_nth<T: Ord + Clone>(elems: &[T], n: usize) -> T {
    elems.sort();
    let t = &elems[n];
    return t.clone();
}
```

Normalnie przy próbie skompilowania tej funkcji kompilator zwraca następujący błąd:

```text
error[E0596]: cannot borrow `*elems` as mutable, as it is behind a `&` reference
 --> test.rs:3:5
  |
3 |     elems.sort();
  |     ^^^^^^^^^^^^ `elems` is a `&` reference, so the data it refers to cannot be borrowed as mutable
```

Załóż, że kompilator NIE odrzucił tej funkcji. Które z poniższych programów (jeśli w ogóle jakieś)
(1) przeszłyby przez kompilator i (2) mogłyby spowodować niezdefiniowane zachowanie po wykonaniu?
Zaznacz każdy program, który spełnia oba kryteria, ALBO zaznacz „Żaden z tych programów”, jeśli żaden ich nie spełnia.
"""
answer.answer = ["Żaden z tych programów"]
prompt.distractors = [
"""
```
let v = vec![5, 4, 3, 2, 1];
find_nth(&v, 10);
```
""",
"""
```
let v = vec![5, 4, 3, 2, 1];
find_nth(&v, 0);
println!("{}", v[0]);
```
""",
"""
```
let v = vec![5, 4, 3, 2, 1];
let n = &v[0];
find_nth(&v, 0);
println!("{}", n);
```
""",
]
context = """
Ten program jest formalnie bezpieczny pod względem pamięci, ponieważ `slice::sort` potrafi jedynie przestawiać
elementy, a nie je zwalniać. Na przykład `&v[0]` po wywołaniu `find_nth` na pewno wskazuje na
*jakąś* liczbę, nawet jeśli nie jest to liczba *oryginalna*.

Zauważ, że `find_nth(&v, 10)` nie powoduje niezdefiniowanego zachowania, ponieważ Rust sprawdza
dostęp do elementów tablicy, więc obliczenie `&v[10]` spowoduje panikę.
"""


