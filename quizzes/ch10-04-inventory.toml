    return `[t]`;
}
```
""",
]
context = """
Funkcja taka jak `find_nth` w oczywisty sposób ma jedynie odczytywać dane, tj.
wyznaczać pewną właściwość sekwencji wejściowej. Dlatego żadne rozwiązanie, które modyfikuje lub zwalnia dane wejściowe, nie zachowuje intencji oryginalnej funkcji, nawet jeśli
jest wydajniejsze niż tworzenie pomocniczego wektora.

Utworzenie `Vec<&T>` jest lepsze niż utworzenie `Vec<T>`, ponieważ jeśli typ `T` jest duży, to
`elems.to_vec()` może być kosztowne. Gdybyśmy jednak wiedzieli, że `T: Copy`, to lepsze byłoby `to_vec`,
bo zmniejszyłoby liczbę dereferencji wskaźników w `elems.sort()`.
"""

