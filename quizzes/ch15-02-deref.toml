type = "Tracing"
prompt.program = """
use std::ops::Deref;

#[derive(Clone, Copy)]
struct AccessLogger(i32);

impl Deref for AccessLogger {
    type Target = i32;
    fn deref(&self) -> &Self::Target {
        println!("deref");
        &self.0
    }
}

fn main() {
  let n = AccessLogger(-1);
  let x = *n + 1;
  let n2 = n;
  println!("{} {}", x, *n)
}
"""
answer.doesCompile = true
answer.stdout = """
deref
deref
0 -1
"""
context = """
`AccessLogger` wypisze „deref” za każdym razem, gdy na `n` wykonywana jest dereferencja, co dzieje się dwa razy.
Zwróć uwagę, że skopiowanie `n` do `n2` nie wykonuje dereferencji `n`.
"""