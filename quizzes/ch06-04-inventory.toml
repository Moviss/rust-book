context = """
Nie ma poprawnego sposobu na zwrócenie wskaźnika do zmiennej zaalokowanej na stosie. Proste rozwiązanie polega więc na zmianie typu zwracanego na `String`
i skopiowaniu wejściowego `user_str` do łańcucha, który jest właścicielem swoich danych. Wymaganie, by `user_str` było typu `String`, ograniczyłoby jednak elastyczność API, np.
wywołujący nie mógłby wywołać `make_separator` na podłańcuchu większego łańcucha. Wymagałoby też od wywołujących alokowania łańcuchów na stercie, np.
nie mogliby użyć literału łańcuchowego, jak w `make_separator("Rust")`.

Najbardziej idiomatyczne rozwiązanie tego problemu korzysta z konstrukcji, której jeszcze nie znasz: [`Cow`](https://doc.rust-lang.org/std/borrow/enum.Cow.html).
Ten inteligentny wskaźnik typu *clone-on-write* (klonowanie przy zapisie) pozwoliłby tej funkcji zwrócić *albo* łańcuch będący właścicielem swoich danych, *albo* referencję do łańcucha, bez błędu typu.
"""

