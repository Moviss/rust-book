Połączenie `is_none` i `unwrap` jest tu w Ruście antywzorcem, ponieważ `match` łączy obie te funkcje i
automatycznie „przepycha” referencję `&Option` do wnętrza, dając `&String`. Dlatego rozwiązanie z `match`
jest najbardziej idiomatyczne i przechodzi przez kompilator bez zmiany zamierzonej sygnatury typu funkcji.

Rozwiązanie polegające na zmianie `&Option` na `Option` nie jest pożądane, ponieważ wymaga od wywołującego przekazania własności jego opcji,
co daje znacznie bardziej restrykcyjne API.
