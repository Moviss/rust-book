id = "1f4e5c06-ecdf-481d-9cae-8a25dafe9cfd"
type = "MultipleChoice"
prompt.prompt = """
**Program 2:**

```ide
/// Gets the string out of an option if it exists,
/// returning a default otherwise
fn get_or_default(arg: &Option<String>) -> String {
    if arg.is_none() {
        return String::new();
    }
    let s = arg.unwrap();
    s.clone()
}
```

Które z poniższych najlepiej opisuje błąd, jaki zgłosiłby kompilator przy próbie skompilowania tej funkcji?
"""
answer.answer = "nie można przenieść wartości z `arg` w `arg.unwrap()`"
prompt.distractors = [
  "nie można wywołać `arg.is_none()` bez dereferencji `arg`",
  "`arg` nie żyje wystarczająco długo",
  "nie można zwrócić `s.clone()`, które nie żyje wystarczająco długo"
]
context = """
Funkcja `Option::unwrap` przyjmuje `self`, czyli oczekuje własności `arg`. Jednak `arg` jest niemutowalną
referencją do opcji, więc nie może przekazać własności opcji. Dlatego kompilator zgłasza, że nie możemy
przenieść wartości z `arg` za pomocą `unwrap`.
"""


