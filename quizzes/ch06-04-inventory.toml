id = "6e5e193e-579d-4a46-aae4-d35336b77b68"
type = "MultipleChoice"
prompt.prompt = """
**Program 1:**

```ide
/// Makes a string to separate lines of text, 
/// returning a default if the provided string is blank
fn make_separator(user_str: &str) -> &str {
    if user_str == "" {
        let default = "=".repeat(10);
        &default
    } else {
        user_str
    }
}
```

Które z poniższych najlepiej opisuje błąd, jaki zgłosiłby kompilator przy próbie skompilowania tej funkcji?
"""
answer.answer = "nie można zwrócić referencji do zmiennej lokalnej `default`"
prompt.distractors = [
  "`user_str` nie żyje wystarczająco długo",
  "funkcja `make_separator` nie może zwrócić referencji typu `&str`",
  "funkcja `make_separator` nie może zwrócić dwóch różnych referencji"
]
context = """
Ponieważ `default` żyje na stosie wewnątrz `make_separator`, zostanie zdealokowane, gdy wywołanie `make_separator` się zakończy.
Wtedy `&default` wskazuje na zdealokowaną pamięć. Dlatego Rust zgłasza, że nie można zwrócić referencji do zmiennej lokalnej.
"""

